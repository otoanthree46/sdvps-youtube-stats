<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登録者推移 | SHADOWVERSE WB</title>
<style>
  :root {
    --bg:#0e1015; --panel:#15181f; --panel2:#1b1f28; --line:#262b36;
    --text:#e6e8ee; --muted:#8b92a1; --accent:#e8b13a; --ok:#6cc28f; --bad:#e0707b;
  }
  * { box-sizing:border-box }
  body { margin:0; color:var(--text); background:var(--bg); min-height:100vh;
    font:13px/1.45 "Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif }
  button, select, input { font:inherit; color:inherit }

  .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:20px; padding:0 20px; height:42px;
    background:rgba(14,16,21,.94); border-bottom:1px solid var(--line) }
  .brand { font-weight:800; letter-spacing:.08em; font-size:13px; display:flex; align-items:center; gap:8px }
  .brand b { color:var(--accent) }
  .brand::before, .h-title::before { content:""; width:5px; height:16px; background:var(--accent); transform:skewX(-18deg); display:inline-block }
  .nav { display:flex; gap:2px; margin-left:auto }
  .nav a { padding:4px 12px; color:var(--text); border-bottom:2px solid var(--accent); text-decoration:none }

  .wrap { max-width:1320px; margin:0 auto; padding:14px 20px 48px }
  .h-title { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; margin:0 0 8px }
  .h-title::before { height:22px }
  .period { color:var(--muted); font-variant-numeric:tabular-nums }

  .picker { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 12px }
  .sel { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:5px 30px 5px 10px; font-weight:700; min-width:150px; cursor:pointer;
    appearance:none; -webkit-appearance:none; color-scheme:dark;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat }
  .sel:focus { outline:1px solid var(--accent) }
  .opt { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:5px 12px; cursor:pointer; color:var(--muted); font-weight:600 }
  .opt:hover { color:var(--text) } .opt.on { border-color:var(--accent); color:var(--text) }
  .seg { display:flex; gap:4px }

  .sec h2 { font-size:14px; margin:18px 0 8px; display:flex; align-items:center; gap:8px }
  .sec h2::before { content:""; width:4px; height:14px; background:var(--accent); transform:skewX(-18deg) }
  .chart { max-height:80vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:6px }
  .chart-in { position:relative; height:520px; padding:10px 8px 6px }
  .note { color:var(--muted); font-size:12px; margin:8px 0 0 }

  .tw { overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:6px; max-height:560px }
  table { width:100%; border-collapse:separate; border-spacing:0 }
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align:left }
  thead th { position:sticky; top:0; background:#1b2030; color:var(--muted); font-weight:700; cursor:pointer; border-bottom:1px solid #39425a }
  thead th:hover { color:var(--text) }
  tbody tr { cursor:pointer } tbody tr:hover td { background:var(--panel2) }
  tr.sel td { background:rgba(232,177,58,.07) }
  td.name { font-weight:700 }
  .up { color:var(--ok) } .down { color:var(--bad) }
  .tm { display:inline-flex; align-items:center; justify-content:center; width:48px; height:22px; border:2px solid; border-radius:6px; font-size:12px; font-weight:700; letter-spacing:.02em }
  .av { position:relative; display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; overflow:hidden;
    background:#2a3040; color:#cbd2e0; font-weight:700; font-size:12px; vertical-align:middle; margin-right:8px; flex:none }
  .av img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
  td.name { display:table-cell } td.name .nm { display:flex; align-items:center }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:-1px }
  @media (max-width:800px) { .chart-in { min-height:420px } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand">SHADOWVERSE <b>WB</b></a>
  <nav class="nav"><a>登録者推移</a></nav>
</header>
<main class="wrap">
  <h1 class="h-title">YouTube登録者数の推移</h1>
  <div class="picker">
    <select class="sel" id="team"><option value="">全チーム</option></select>
    <div class="seg" id="range">
      <button class="opt" data-d="30">1ヶ月</button><button class="opt" data-d="90">3ヶ月</button><button class="opt" data-d="180">6ヶ月</button><button class="opt" data-d="365">1年</button><button class="opt on" data-d="0">全期間</button>
    </div>
    <button class="opt" id="log">対数軸</button>
    <button class="opt" id="all">表示中を全員選択</button>
    <button class="opt" id="clear">選択解除</button>
    <span class="period" id="asof"></span>
  </div>
  <div class="chart"><div class="chart-in" id="cin"><canvas id="c"></canvas></div></div>
  <p class="note">● 実測値。2026/9以前はExcel記録(百人単位に丸め)、以降はYouTube API値(上位3桁)。点線は60日以上データが空いた区間。左右のラベルは各選手の期間の開始値・終了値。</p>
  <section class="sec"><h2>一覧(クリックでグラフに追加/除外)</h2>
    <div class="tw"><table id="tbl"><thead><tr>
      <th></th><th data-k="team">チーム</th><th data-k="name">名前</th><th data-k="latest">登録者数</th><th data-k="d30">30日増</th><th data-k="date">最終更新</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const PALETTE = ["#e8b13a","#56c2e6","#e0707b","#6cc28f","#b79cf0","#ff9d5c","#7fd1c7","#f2d16b","#d98ac4","#9fb1c9"];
const GAP_MS = 60 * 864e5, DAY = 864e5, LABEL_W = 166, IC = 20;
const csv = t => t.replace(/^﻿/,"").trim().split(/\r?\n/).map(l => l.split(","));
const toObjs = rows => { const h = rows[0]; return rows.slice(1).map(r => Object.fromEntries(h.map((k,i)=>[k,r[i]]))); };
const fmt = n => n.toLocaleString();
const iconUrl = name => `icons/${encodeURIComponent(name)}.jpg`;
// 丸型アイコン(画像があれば画像、なければ頭文字)をcanvasで作る。チャート上のラベルとツールチップで共用
function circ(img, label, color, size = 24) {
  const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d");
  x.beginPath(); x.arc(size/2, size/2, size/2, 0, 7); x.closePath(); x.clip();
  if (img) { const m = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - m)/2, sy = (img.naturalHeight - m)/2; x.drawImage(img, sx, sy, m, m, 0, 0, size, size); }
  else { x.fillStyle = color; x.fillRect(0, 0, size, size); x.fillStyle = "#0e1015"; x.font = `700 ${size*.5}px sans-serif`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText([...label][0], size/2, size/2 + 1); }
  return c;
}
const r10 = n => n < 1000 ? Math.round(n / 10) * 10 : n;   // 1,000未満は10の位までに四捨五入
// チームバッジの配色(shadowverse-reference.com に準拠)[背景, 枠・文字]
const TEAMS = { CR:["#d4d4d8","#e11919"], DFM:["#d4d4d8","#2567fd"], LVH:["#000","#8fc31f"], MRG:["#000","#f91711"],
  RC:["#000","#d4d4d8"], RID:["#000","#ffe300"], VL:["#134647","#b89f76"], ZETA:["#d4d4d8","#000"] };
const teamBadge = t => { const c = TEAMS[t]; return c ? `<span class="tm" style="background:${c[0]};color:${c[1]};border-color:${c[0]==="#d4d4d8"&&t==="ZETA"?c[0]:c[1]}">${t}</span>`
  : `<span class="tm" style="color:#8b92a1;border-style:dashed;border-color:#4a5262">${t}</span>`; };
const store = (k, v) => { try { if (v !== undefined) localStorage.setItem(k, v); return localStorage.getItem(k); } catch { return null; } };

// 各系列の最初/最後の点に対応する高さへ、重ならないよう名前ラベルを左右に配置する
const endLabels = {
  id: "endLabels",
  afterDatasetsDraw(chart) {
    const { ctx, chartArea: a, scales: { y } } = chart;
    const narrow = chart.width < 700;
    ctx.save(); ctx.font = "600 12px 'Segoe UI','Yu Gothic UI',sans-serif"; ctx.textBaseline = "middle";
    const place = (items) => {            // items: {y,...} → 最小間隔14pxで上から詰め直す
      items.sort((p, q) => p.y - q.y);
      for (let i = 1; i < items.length; i++) if (items[i].y - items[i-1].y < 14) items[i].y = items[i-1].y + 14;
      const over = items.length ? items[items.length-1].y - (a.bottom - 6) : 0;
      if (over > 0) items.forEach(it => it.y -= over);
      for (let i = items.length - 2; i >= 0; i--) if (items[i+1].y - items[i].y < 14) items[i].y = items[i+1].y - 14;
    };
    for (const side of ["left", "right"]) {
      if (narrow && side === "left") continue;
      const items = [];
      chart.data.datasets.forEach((d, i) => {
        if (!chart.isDatasetVisible(i) || !d.data.length) return;
        const p = side === "left" ? d.data[0] : d.data[d.data.length-1];
        items.push({ d, p, y: y.getPixelForValue(p.y), py: y.getPixelForValue(p.y), px: chart.scales.x.getPixelForValue(p.x) });
      });
      place(items);
      for (const it of items) {
        const x0 = side === "left" ? y.left - 6 : a.right + 8;
        ctx.fillStyle = it.d.borderColor; ctx.globalAlpha = 1;
        const val = fmt(it.p.y); let name = it.d.label, text = `${name} ${val}`;
        while (ctx.measureText(text).width > LABEL_W - IC - 6 && name.length > 1) { name = name.slice(0, -1); text = `${name}… ${val}`; }
        ctx.textAlign = side === "left" ? "right" : "left";
        const ic = it.d.ic, tw = ctx.measureText(text).width;
        if (side === "left") { ctx.fillText(text, x0 - IC - 5, it.y); if (ic) ctx.drawImage(ic, x0 - IC, it.y - IC/2, IC, IC); }
        else { if (ic) ctx.drawImage(ic, x0, it.y - IC/2, IC, IC); ctx.fillText(text, x0 + IC + 5, it.y); }
        // 点から端までの引き出し線
        ctx.globalAlpha = .35; ctx.strokeStyle = it.d.borderColor; ctx.setLineDash([2, 3]); ctx.beginPath();
        if (side === "left") { ctx.moveTo(a.left, it.py); ctx.lineTo(it.px, it.py); } else { ctx.moveTo(it.px, it.py); ctx.lineTo(a.right, it.py); }
        ctx.stroke(); ctx.setLineDash([]);
        if (Math.abs(it.y - it.py) > 1) { ctx.beginPath(); ctx.moveTo(side === "left" ? a.left : a.right, it.py); ctx.lineTo(side === "left" ? y.left - 4 : a.right + 6, it.y); ctx.stroke(); }
      }
    }
    ctx.restore();
  }
};

let chans = [], sel = new Set(), sortKey = "latest", sortDir = -1, rangeDays = 0, logScale = false, chart;

(async () => {
  const [c, s] = await Promise.all(["data/channels.csv","data/subscribers.csv"].map(u => fetch(u).then(r => r.text())));
  const pts = {};
  for (const r of toObjs(csv(s))) (pts[r.key] ||= []).push({ x: new Date(r.date).getTime(), y: r10(+r.subscribers) });
  chans = toObjs(csv(c)).map(ch => {
    const p = (pts[ch.key] || []).sort((a,b)=>a.x-b.x), last = p[p.length-1];
    const base = last && [...p].reverse().find(q => q.x <= last.x - 30*DAY);
    return { ...ch, p, latest: last?.y ?? 0, date: last?.x ?? 0, d30: base ? last.y - base.y : null };
  }).filter(ch => ch.p.length);
  chans.forEach((ch,i)=> {
    ch.color = PALETTE[i % PALETTE.length];
    ch.ic = circ(null, ch.name, ch.color);                       // 画像が読めるまで/無い選手は頭文字
    const im = new Image(); im.onload = () => { ch.ic = circ(im, ch.name, ch.color); if (chart) render(); }; im.src = iconUrl(ch.name);
  });
  try { JSON.parse(store("sel") || "[]").forEach(k => chans.some(c=>c.key===k) && sel.add(k)); } catch {}
  if (!sel.size) chans.slice().sort((a,b)=>b.latest-a.latest).slice(0,6).forEach(ch => sel.add(ch.key));

  document.getElementById("team").append(...[...new Set(chans.map(c=>c.team))].map(t => new Option(t, t)));
  document.getElementById("asof").textContent = "最終データ: " + new Date(Math.max(...chans.map(c=>c.date))).toLocaleDateString("ja-JP");

  Chart.defaults.color = "#8b92a1"; Chart.defaults.borderColor = "#262b36";
  chart = new Chart(document.getElementById("c"), {
    type: "line", data: { datasets: [] }, plugins: [endLabels],
    options: { responsive:true, maintainAspectRatio:false, parsing:false, interaction:{mode:"nearest",intersect:false},
      layout:{ padding:{ left:LABEL_W, right:LABEL_W + 10 } },
      scales:{ x:{type:"time",time:{unit:"month",displayFormats:{month:"yy/M"},tooltipFormat:"yyyy/M/d"},grid:{color:"#1d212b"}},
               y:{type:"linear",ticks:{callback:v=>fmt(v)},grid:{color:"#1d212b"}} },
      plugins:{ legend:{display:false}, tooltip:{backgroundColor:"#1b1f28",borderColor:"#262b36",borderWidth:1,titleColor:"#e6e8ee",bodyColor:"#e6e8ee",
        usePointStyle:true, boxWidth:22, boxHeight:22, boxPadding:4, padding:8,
        callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`, labelPointStyle:c=>({pointStyle:c.dataset.ic||"circle", rotation:0})}} } }
  });
  const on = (id, ev, f) => document.getElementById(id).addEventListener(ev, f);
  on("team","change",render);
  on("log","click",e=>{ logScale = !logScale; e.currentTarget.classList.toggle("on", logScale); render(); });
  on("all","click",()=>{ const t = document.getElementById("team").value; chans.filter(c => !t || c.team === t).forEach(c => sel.add(c.key)); render(); });
  on("clear","click",()=>{ sel.clear(); render(); });
  document.querySelectorAll("#range button").forEach(b => b.onclick = () => {
    rangeDays = +b.dataset.d; document.querySelectorAll("#range button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
  document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    sortDir = sortKey===th.dataset.k ? -sortDir : -1; sortKey = th.dataset.k; render(); });
  render();
})();

function render() {
  const team = document.getElementById("team").value, maxDate = Math.max(...chans.map(c=>c.date));
  const min = rangeDays ? maxDate - rangeDays*DAY : -Infinity;
  const rows = chans.filter(c => !team || c.team === team);
  chart.data.datasets = rows.filter(c => sel.has(c.key)).map(c => ({
    label: c.name, ic: c.ic, data: c.p.filter(q => q.x >= min), borderColor: c.color, backgroundColor: c.color,
    borderWidth: 2, pointRadius: 3, tension: 0,
    segment: { borderDash: ctx => ctx.p1.parsed.x - ctx.p0.parsed.x > GAP_MS ? [6,4] : undefined }
  })).filter(d => d.data.length);
  // 系列が増えたら縦に伸ばす(ラベルが1行14px必要)。伸びすぎる分は枠内スクロール
  const n = chart.data.datasets.length;
  document.getElementById("cin").style.height = Math.max(520, n * 17 + 150) + "px";
  chart.options.scales.y.type = logScale ? "logarithmic" : "linear";
  chart.update();
  store("sel", JSON.stringify([...sel]));

  rows.sort((a,b) => (a[sortKey] > b[sortKey] ? 1 : -1) * sortDir);
  document.querySelector("#tbl tbody").innerHTML = rows.map(c => {
    const d = c.d30, cls = d > 0 ? "up" : d < 0 ? "down" : "", on = sel.has(c.key);
    return `<tr class="${on?"sel":""}" data-k="${c.key}">
      <td><span class="dot" style="background:${on?c.color:"transparent"};border:1px solid ${c.color}"></span></td>
      <td>${teamBadge(c.team)}</td><td class="name"><div class="nm"><span class="av">${[...c.name][0]}<img src="${iconUrl(c.name)}" alt="" onerror="this.remove()"></span>${c.name}</div></td>
      <td>${fmt(c.latest)}</td><td class="${cls}">${d==null?"-":(d>0?"+":"")+fmt(d)}</td>
      <td>${new Date(c.date).toLocaleDateString("ja-JP")}</td></tr>`;
  }).join("");
  document.querySelectorAll("#tbl tbody tr").forEach(tr => tr.onclick = () => {
    sel.has(tr.dataset.k) ? sel.delete(tr.dataset.k) : sel.add(tr.dataset.k); render(); });
}
</script>
</body>
</html>
